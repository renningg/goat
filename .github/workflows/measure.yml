name: Verify macOS package summary on release assets
on:
  push:
    branches: [bench/macos-artifact-upload]
permissions:
  contents: read
jobs:
  summary:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download released artifacts
        run: |
          mkdir inputs
          cd inputs
          for ext in dmg zip; do
            curl --fail --location --retry 3 -O "https://github.com/goat-si/goat/releases/download/v0.1.11/GOAT-0.1.11-arm64.$ext"
          done
      - name: Report bundle sizes
        run: python3 .github/scripts/macos-package-sizes.py inputs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare with independently extracted regular files
        run: |
          unzip -q 'inputs/*.zip' -d extracted
          python3 - <<'PY'
          from pathlib import Path
          import runpy
          from zipfile import ZipFile
          contents, = Path('extracted').glob('*.app/Contents')
          disk = sum(p.stat().st_size for p in contents.rglob('*') if not p.is_symlink() and p.is_file())
          with ZipFile(next(Path('inputs').glob('*.zip'))) as z:
              indexed = sum(runpy.run_path('.github/scripts/macos-package-sizes.py')['bundle_sizes'](z).values())
          print(f'Extracted regular file bytes: {disk}, reported bytes: {indexed}')
          assert disk == indexed
          PY
